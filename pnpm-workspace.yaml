# pnpm blocks package build scripts by default. These are the ones this project
# genuinely needs to run: Prisma generates its client, sharp compiles the image
# pipeline Next.js uses in production, esbuild/unrs-resolver ship native binaries.
allowBuilds:
  '@firebase/util': true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
